<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>美妝與日用品庫存管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: #fdf8f8;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 pb-24">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-rose-100 px-4 py-3 shadow-sm">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-rose-500 to-pink-600 text-white flex items-center justify-center shadow-sm shrink-0">
          <i class="fa-solid fa-sparkles"></i>
        </div>
        <div class="min-w-0">
          <h1 class="text-base font-bold text-slate-800 truncate">美妝與日用品庫存管家</h1>
          <div class="flex items-center gap-1.5 text-[11px] text-slate-500">
            <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span id="syncStatusText" class="truncate">本機模式（點擊右側設定雲端）</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="openSettingsModal()" class="px-2.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium flex items-center gap-1 transition">
          <i class="fa-solid fa-cloud text-sky-500"></i>
          <span>雲端/AI</span>
        </button>
        <button onclick="openItemModal()" class="px-3 py-2 rounded-xl bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white text-xs font-bold shadow-sm flex items-center gap-1 transition">
          <i class="fa-solid fa-plus"></i>
          <span>新增</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-2xl mx-auto px-4 pt-4 space-y-4">

    <!-- 統計摘要卡片 -->
    <section class="grid grid-cols-4 gap-2">
      <button onclick="setFilter('all')" id="stat-all" class="bg-white rounded-2xl p-2.5 border border-rose-100 shadow-sm text-center transition">
        <div class="text-lg font-extrabold text-slate-800" id="countAll">0</div>
        <div class="text-[11px] text-slate-500">全部品項</div>
      </button>
      <button onclick="setFilter('opened')" id="stat-opened" class="bg-white rounded-2xl p-2.5 border border-slate-100 shadow-sm text-center transition">
        <div class="text-lg font-extrabold text-emerald-600" id="countOpened">0</div>
        <div class="text-[11px] text-slate-500">已開封</div>
      </button>
      <button onclick="setFilter('expiring')" id="stat-expiring" class="bg-white rounded-2xl p-2.5 border border-slate-100 shadow-sm text-center transition">
        <div class="text-lg font-extrabold text-amber-500" id="countExpiring">0</div>
        <div class="text-[11px] text-slate-500">效期預警</div>
      </button>
      <button onclick="setFilter('low')" id="stat-low" class="bg-white rounded-2xl p-2.5 border border-slate-100 shadow-sm text-center transition">
        <div class="text-lg font-extrabold text-rose-500" id="countLow">0</div>
        <div class="text-[11px] text-slate-500">低庫存</div>
      </button>
    </section>

    <!-- 搜尋與分類篩選 -->
    <section class="space-y-2.5">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="renderItems()" placeholder="搜尋品牌、品名、色號或條碼..."
          class="w-full pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-rose-400" />
      </div>

      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
        <button onclick="setCategory('全部')" data-cat="全部" class="cat-tab px-3.5 py-1.5 rounded-full text-xs font-bold bg-rose-500 text-white shrink-0">全部</button>
        <button onclick="setCategory('保養品')" data-cat="保養品" class="cat-tab px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 shrink-0">保養品</button>
        <button onclick="setCategory('化妝品')" data-cat="化妝品" class="cat-tab px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 shrink-0">化妝品</button>
        <button onclick="setCategory('日用品')" data-cat="日用品" class="cat-tab px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 shrink-0">日用品</button>
      </div>
    </section>

    <!-- 庫存清單列表 -->
    <section id="itemList" class="space-y-3"></section>
  </main>

  <!-- 新增 / 編輯品項彈窗 -->
  <div id="itemModal" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs hidden flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[92vh] overflow-y-auto shadow-2xl">
      <div class="sticky top-0 z-10 bg-white/95 backdrop-blur px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-bold text-slate-800">新增庫存品項</h2>
        <button onclick="closeItemModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="itemForm" onsubmit="saveItem(event)" class="p-5 space-y-4">
        <input type="hidden" id="editItemId" />

        <!-- 智慧條碼查詢 & AI 視覺辨識卡片 -->
        <div class="bg-gradient-to-br from-rose-50 via-pink-50 to-indigo-50 border border-rose-100 rounded-2xl p-3.5 space-y-3">
          <div>
            <div class="text-xs font-bold text-slate-800">智慧條碼查詢 & AI 視覺辨識</div>
            <div class="text-[11px] text-slate-500">直接拍商品正面即可自動建檔並帶入封面縮圖</div>
          </div>

          <div class="flex flex-wrap gap-2">
            <button type="button" onclick="startBarcodeScanner()" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs transition">
              <i class="fa-solid fa-barcode"></i>
              <span>掃條碼</span>
            </button>

            <label class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs cursor-pointer transition">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>✨ Gemini 辨識</span>
              <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleSmartBottleCapture(event)" />
            </label>
          </div>

          <!-- 條碼相機掃描容器 -->
          <div id="scannerContainer" class="hidden rounded-xl overflow-hidden border border-rose-200 bg-black relative">
            <div id="reader" class="w-full"></div>
            <button type="button" onclick="stopBarcodeScanner()" class="w-full py-2 bg-slate-800 text-white text-xs font-bold">關閉相機掃描</button>
          </div>

          <!-- 辨識 / 查詢即時狀態提示框 -->
          <div id="ocrResultBox" class="hidden rounded-xl bg-white/90 border border-indigo-200 p-2.5 text-xs text-slate-700 leading-relaxed">
            <span id="ocrStatusText"></span>
          </div>
        </div>

        <!-- 商品封面縮圖（自動帶入或手動補拍） -->
        <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 flex items-center gap-3">
          <div class="w-16 h-16 rounded-xl bg-white border border-slate-200 flex items-center justify-center overflow-hidden shrink-0 relative">
            <i id="photoPlaceholderIcon" class="fa-regular fa-image text-slate-300 text-xl"></i>
            <img id="itemPhotoPreview" src="" alt="封面縮圖" class="w-full h-full object-cover hidden" />
          </div>
          <div class="flex-1 min-w-0 space-y-1.5">
            <div class="text-xs font-bold text-slate-700">商品封面縮圖（自動帶入 / 選填）</div>
            <div class="text-[11px] text-slate-500">使用 Gemini 辨識拍正面時會自動帶入</div>
            <div class="flex items-center gap-2">
              <label class="px-2.5 py-1 rounded-lg bg-white border border-slate-300 text-[11px] font-medium text-slate-700 cursor-pointer hover:bg-slate-100">
                <i class="fa-solid fa-camera mr-1"></i>重拍縮圖
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleManualThumbCapture(event)" />
              </label>
              <button type="button" onclick="clearThumbPhoto()" class="text-[11px] text-rose-500 hover:underline">清除</button>
            </div>
          </div>
          <input type="hidden" id="itemPhotoData" />
        </div>

        <!-- 分類與條碼 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">商品分類 *</label>
            <select id="itemCategory" required class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm">
              <option value="保養品">保養品</option>
              <option value="化妝品">化妝品</option>
              <option value="日用品">日用品</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">條碼編號</label>
            <div class="flex gap-1">
              <input type="text" id="itemBarcode" placeholder="輸入或掃描" class="w-full min-w-0 px-2.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
              <button type="button" onclick="lookupBarcodeInfo()" class="px-2.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold shrink-0">查詢</button>
            </div>
          </div>
        </div>

        <!-- 品牌與品名 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-xs font-bold text-slate-700">品牌名稱</label>
              <button type="button" onclick="swapBrandAndName()" class="text-[11px] text-indigo-600 font-medium">⇄ 互換</button>
            </div>
            <input type="text" id="itemBrand" placeholder="例：TOKIO INKARAMI、肌研" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">商品名稱 *</label>
            <input type="text" id="itemName" required placeholder="完整品名與容量" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
          </div>
        </div>

        <!-- 數量、安全庫存、單位 -->
        <div class="grid grid-cols-3 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">目前數量 *</label>
            <input type="number" id="itemQty" value="1" min="0" required class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">安全庫存</label>
            <input type="number" id="itemMinQty" placeholder="不提醒" min="0" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">單位</label>
            <input type="text" id="itemUnit" value="瓶" placeholder="瓶/罐/支" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
          </div>
        </div>

        <!-- 出廠效期與 PAO 開封保質期 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">出廠有效期限 (EXP)</label>
            <input type="date" id="itemExpDate" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">開封後保質期 (PAO)</label>
            <select id="itemPao" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm">
              <option value="0">無限制 / 不計算</option>
              <option value="3">3 個月 (3M)</option>
              <option value="6">6 個月 (6M)</option>
              <option value="12" selected>12 個月 (12M)</option>
              <option value="18">18 個月 (18M)</option>
              <option value="24">24 個月 (24M)</option>
            </select>
          </div>
        </div>

        <!-- 開封狀態與備註 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">開封日期（已開封再填）</label>
            <input type="date" id="itemOpenDate" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">色號 / 存放位置備註</label>
            <input type="text" id="itemNote" placeholder="例：#02 乾燥玫瑰 / 浴室櫃" class="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-sm" />
          </div>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeItemModal()" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-700 text-sm font-bold">取消</button>
          <button type="submit" class="flex-2 w-2/3 py-3 rounded-xl bg-gradient-to-r from-rose-500 to-pink-600 text-white text-sm font-bold shadow-md">儲存品項</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 雲端同步與 AI Worker 設定彈窗 -->
  <div id="settingsModal" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="text-base font-bold text-slate-800">雲端同步與 AI 視覺辨識設定</h3>
        <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Cloudflare AI Worker 網址（已預設填入）</label>
          <input type="url" id="settingWorkerUrl" placeholder="https://beauty-stock-api.wenhao0521.workers.dev"
            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs" />
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Firebase Realtime Database 網址（選填，跨裝置同步用）</label>
          <input type="url" id="settingFirebaseUrl" placeholder="https://你的專案.firebaseio.com"
            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs" />
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">家庭共享空間代碼（與家人填相同代碼即可同步）</label>
          <input type="text" id="settingSpaceId" placeholder="例如：huang_family_2026"
            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-xs" />
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeSettingsModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">關閉</button>
        <button onclick="saveCloudSettings()" class="flex-1 py-2.5 rounded-xl bg-sky-600 text-white text-xs font-bold">儲存並連線</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_WORKER_URL = 'https://beauty-stock-api.wenhao0521.workers.dev';
    let inventory = JSON.parse(localStorage.getItem('beauty_inventory_v2') || '[]');
    let localBarcodeMemory = JSON.parse(localStorage.getItem('beauty_barcode_memory') || '{}');
    let currentCategory = '全部';
    let currentFilter = 'all';
    let html5QrCode = null;

    // 初始化設定與同步
    window.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('beauty_ai_worker_url')) {
        localStorage.setItem('beauty_ai_worker_url', DEFAULT_WORKER_URL);
      }
      renderItems();
      syncFromFirebase();
    });

    function getFirebaseConfig() {
      return {
        dbUrl: (localStorage.getItem('beauty_fb_url') || '').trim().replace(/\/+$/, ''),
        spaceId: (localStorage.getItem('beauty_space_id') || 'default_home').trim()
      };
    }

    async function syncFromFirebase() {
      const { dbUrl, spaceId } = getFirebaseConfig();
      const dot = document.getElementById('syncStatusDot');
      const txt = document.getElementById('syncStatusText');
      if (!dbUrl) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        txt.textContent = 'AI 辨識已就緒（本機儲存）';
        return;
      }
      try {
        const res = await fetch(`${dbUrl}/spaces/${encodeURIComponent(spaceId)}/items.json`);
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') {
            inventory = Object.values(data);
            localStorage.setItem('beauty_inventory_v2', JSON.stringify(inventory));
            renderItems();
          }
          dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
          txt.textContent = `已同步：${spaceId}`;
        }
      } catch (e) {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400';
        txt.textContent = '離線快取模式';
      }
    }

    async function pushToFirebase(item) {
      const { dbUrl, spaceId } = getFirebaseConfig();
      if (!dbUrl) return;
      try {
        await fetch(`${dbUrl}/spaces/${encodeURIComponent(spaceId)}/items/${encodeURIComponent(item.id)}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(item)
        });
      } catch (e) {}
    }

    async function deleteFromFirebase(id) {
      const { dbUrl, spaceId } = getFirebaseConfig();
      if (!dbUrl) return;
      try {
        await fetch(`${dbUrl}/spaces/${encodeURIComponent(spaceId)}/items/${encodeURIComponent(id)}.json`, {
          method: 'DELETE'
        });
      } catch (e) {}
    }

    // 核心功能：Gemini AI 拍正面視覺辨識 + 自動壓縮帶入封面縮圖
    async function handleSmartBottleCapture(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const statusBox = document.getElementById('ocrResultBox');
      const statusText = document.getElementById('ocrStatusText');
      statusBox.classList.remove('hidden');
      statusText.innerHTML = '⏳ 正在壓縮照片並呼叫 Gemini AI 視覺辨識...';

      try {
        const { fullBase64, thumbDataUrl } = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              // 1. 辨識用壓縮圖（長邊 1024px，確保清晰且上傳快速不超時）
              const maxAiSize = 1024;
              let w1 = img.width, h1 = img.height;
              if (w1 > maxAiSize || h1 > maxAiSize) {
                if (w1 > h1) { h1 = Math.round(h1 * maxAiSize / w1); w1 = maxAiSize; }
                else { w1 = Math.round(w1 * maxAiSize / h1); h1 = maxAiSize; }
              }
              const c1 = document.createElement('canvas');
              c1.width = w1; c1.height = h1;
              c1.getContext('2d').drawImage(img, 0, 0, w1, h1);
              const aiDataUrl = c1.toDataURL('image/jpeg', 0.8);

              // 2. 封面縮圖用（寬度 320px，約 30KB 節省資料庫空間）
              const maxThumb = 320;
              let w2 = img.width, h2 = img.height;
              if (w2 > maxThumb) { h2 = Math.round(h2 * maxThumb / w2); w2 = maxThumb; }
              const c2 = document.createElement('canvas');
              c2.width = w2; c2.height = h2;
              c2.getContext('2d').drawImage(img, 0, 0, w2, h2);
              const thumbUrl = c2.toDataURL('image/jpeg', 0.65);

              resolve({
                fullBase64: aiDataUrl.split(',')[1],
                thumbDataUrl: thumbUrl
              });
            };
            img.onerror = () => reject(new Error('圖片格式讀取失敗'));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error('檔案讀取失敗'));
          reader.readAsDataURL(file);
        });

        // 自動將正面照帶入封面縮圖預覽
        setThumbPreview(thumbDataUrl);

        const workerUrl = (localStorage.getItem('beauty_ai_worker_url') || DEFAULT_WORKER_URL).trim().replace(/\/+$/, '');
        const res = await fetch(`${workerUrl}/vision`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imageBase64: fullBase64, mimeType: 'image/jpeg' })
        });

        const json = await res.json();
        if (!res.ok || !json.success) {
          throw new Error(json.error || `伺服器回應錯誤 (${res.status})`);
        }

        const item = json.data || {};
        if (item.brand) document.getElementById('itemBrand').value = item.brand;
        if (item.name) document.getElementById('itemName').value = item.name;
        if (item.category) {
          const catSelect = document.getElementById('itemCategory');
          if ([...catSelect.options].some(o => o.value === item.category)) {
            catSelect.value = item.category;
          }
        }
        if (item.pao !== undefined) {
          document.getElementById('itemPao').value = String(item.pao);
        }
        if (item.note) {
          document.getElementById('itemNote').value = item.note;
        }

        statusText.innerHTML = `✨ <b class="text-emerald-700">Gemini AI 視覺辨識完成！</b>（已自動帶入正面封面縮圖）`;
      } catch (err) {
        statusText.innerHTML = `⚠️ <b class="text-rose-600">Gemini 辨識失敗：</b>${err.message}`;
      } finally {
        event.target.value = '';
      }
    }

    // 手動重拍縮圖
    function handleManualThumbCapture(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxThumb = 320;
          let w = img.width, h = img.height;
          if (w > maxThumb) { h = Math.round(h * maxThumb / w); w = maxThumb; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          setThumbPreview(canvas.toDataURL('image/jpeg', 0.65));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function setThumbPreview(dataUrl) {
      const preview = document.getElementById('itemPhotoPreview');
      const icon = document.getElementById('photoPlaceholderIcon');
      const input = document.getElementById('itemPhotoData');
      if (dataUrl) {
        preview.src = dataUrl;
        preview.classList.remove('hidden');
        icon.classList.add('hidden');
        input.value = dataUrl;
      } else {
        preview.src = '';
        preview.classList.add('hidden');
        icon.classList.remove('hidden');
        input.value = '';
      }
    }

    function clearThumbPhoto() {
      setThumbPreview('');
    }

    // 多層條碼查詢（本機記憶庫 -> Firebase 共享池 -> Cloudflare Worker）
    async function lookupBarcodeInfo() {
      const code = document.getElementById('itemBarcode').value.trim();
      if (!code) return;

      const statusBox = document.getElementById('ocrResultBox');
      const statusText = document.getElementById('ocrStatusText');
      statusBox.classList.remove('hidden');
      statusText.innerHTML = `🔍 正在查詢條碼 <b>${code}</b>...`;

      // 1. 本機記憶庫
      if (localBarcodeMemory[code]) {
        applyBarcodeRecord(localBarcodeMemory[code], '本機記憶庫');
        return;
      }

      // 2. Firebase 群眾共享池
      const { dbUrl } = getFirebaseConfig();
      if (dbUrl) {
        try {
          const fbRes = await fetch(`${dbUrl}/global_beauty_barcodes/${encodeURIComponent(code)}.json`);
          if (fbRes.ok) {
            const fbData = await fbRes.json();
            if (fbData && fbData.name) {
              localBarcodeMemory[code] = fbData;
              localStorage.setItem('beauty_barcode_memory', JSON.stringify(localBarcodeMemory));
              applyBarcodeRecord(fbData, '群眾共享條碼庫');
              return;
            }
          }
        } catch (e) {}
      }

      // 3. Cloudflare Worker 外部查詢
      try {
        const workerUrl = (localStorage.getItem('beauty_ai_worker_url') || DEFAULT_WORKER_URL).trim().replace(/\/+$/, '');
        const res = await fetch(`${workerUrl}/barcode?code=${encodeURIComponent(code)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.found && data.rawTitle) {
            document.getElementById('itemName').value = data.rawTitle;
            statusText.innerHTML = `✅ 已從 <b>${data.source}</b> 帶入商品名稱！`;
            return;
          }
        }
      } catch (e) {}

      statusText.innerHTML = `ℹ️ 資料庫尚無此條碼紀錄，建議直接點擊上方 <b>「✨ Gemini 辨識」</b> 拍正面建檔！`;
    }

    function applyBarcodeRecord(rec, sourceLabel) {
      if (rec.brand) document.getElementById('itemBrand').value = rec.brand;
      if (rec.name) document.getElementById('itemName').value = rec.name;
      if (rec.category) document.getElementById('itemCategory').value = rec.category;
      if (rec.pao !== undefined) document.getElementById('itemPao').value = String(rec.pao);
      document.getElementById('ocrStatusText').innerHTML = `⚡ 已從 <b>${sourceLabel}</b> 0 秒帶入完整商品資料！`;
    }

    // 相機掃條碼
    function startBarcodeScanner() {
      const container = document.getElementById('scannerContainer');
      container.classList.remove('hidden');
      html5QrCode = new Html5Qrcode('reader');
      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 120 } },
        (decodedText) => {
          document.getElementById('itemBarcode').value = decodedText;
          stopBarcodeScanner();
          lookupBarcodeInfo();
        },
        () => {}
      ).catch(() => {
        container.classList.add('hidden');
        alert('無法開啟相機，請確認瀏覽器相機權限或手動輸入條碼。');
      });
    }

    function stopBarcodeScanner() {
      const container = document.getElementById('scannerContainer');
      container.classList.add('hidden');
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
        html5QrCode = null;
      }
    }

    function swapBrandAndName() {
      const b = document.getElementById('itemBrand');
      const n = document.getElementById('itemName');
      [b.value, n.value] = [n.value, b.value];
    }

    // 彈窗控制與儲存
    function openItemModal(item = null) {
      document.getElementById('itemForm').reset();
      document.getElementById('ocrResultBox').classList.add('hidden');
      setThumbPreview('');

      if (item) {
        document.getElementById('modalTitle').textContent = '編輯庫存品項';
        document.getElementById('editItemId').value = item.id;
        document.getElementById('itemCategory').value = item.category || '保養品';
        document.getElementById('itemBarcode').value = item.barcode || '';
        document.getElementById('itemBrand').value = item.brand || '';
        document.getElementById('itemName').value = item.name || '';
        document.getElementById('itemQty').value = item.qty ?? 1;
        document.getElementById('itemMinQty').value = item.minQty ?? '';
        document.getElementById('itemUnit').value = item.unit || '瓶';
        document.getElementById('itemExpDate').value = item.expDate || '';
        document.getElementById('itemPao').value = String(item.pao ?? 12);
        document.getElementById('itemOpenDate').value = item.openDate || '';
        document.getElementById('itemNote').value = item.note || '';
        if (item.photo) setThumbPreview(item.photo);
      } else {
        document.getElementById('modalTitle').textContent = '新增庫存品項';
        document.getElementById('editItemId').value = '';
      }
      document.getElementById('itemModal').classList.remove('hidden');
    }

    function closeItemModal() {
      stopBarcodeScanner();
      document.getElementById('itemModal').classList.add('hidden');
    }

    async function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('editItemId').value || ('item_' + Date.now());
      const barcode = document.getElementById('itemBarcode').value.trim();
      const brand = document.getElementById('itemBrand').value.trim();
      const name = document.getElementById('itemName').value.trim();
      const category = document.getElementById('itemCategory').value;
      const pao = parseInt(document.getElementById('itemPao').value || '0', 10);

      const newItem = {
        id,
        category,
        barcode,
        brand,
        name,
        qty: parseInt(document.getElementById('itemQty').value || '0', 10),
        minQty: document.getElementById('itemMinQty').value !== '' ? parseInt(document.getElementById('itemMinQty').value, 10) : null,
        unit: document.getElementById('itemUnit').value.trim() || '瓶',
        expDate: document.getElementById('itemExpDate').value,
        pao,
        openDate: document.getElementById('itemOpenDate').value,
        note: document.getElementById('itemNote').value.trim(),
        photo: document.getElementById('itemPhotoData').value,
        updatedAt: Date.now()
      };

      const idx = inventory.findIndex(x => x.id === id);
      if (idx >= 0) inventory[idx] = newItem;
      else inventory.unshift(newItem);

      localStorage.setItem('beauty_inventory_v2', JSON.stringify(inventory));
      await pushToFirebase(newItem);

      // 若有填寫條碼，同步寫入本機與 Firebase 群眾共享池
      if (barcode && name) {
        const meta = { brand, name, category, pao, updatedAt: Date.now() };
        localBarcodeMemory[barcode] = meta;
        localStorage.setItem('beauty_barcode_memory', JSON.stringify(localBarcodeMemory));

        const { dbUrl } = getFirebaseConfig();
        if (dbUrl) {
          fetch(`${dbUrl}/global_beauty_barcodes/${encodeURIComponent(barcode)}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(meta)
          }).catch(() => {});
        }
      }

      closeItemModal();
      renderItems();
    }

    async function adjustQty(id, delta) {
      const item = inventory.find(x => x.id === id);
      if (!item) return;
      item.qty = Math.max(0, (item.qty || 0) + delta);
      item.updatedAt = Date.now();
      localStorage.setItem('beauty_inventory_v2', JSON.stringify(inventory));
      renderItems();
      await pushToFirebase(item);
    }

    async function removeItem(id) {
      if (!confirm('確定要刪除這筆庫存紀錄嗎？')) return;
      inventory = inventory.filter(x => x.id !== id);
      localStorage.setItem('beauty_inventory_v2', JSON.stringify(inventory));
      renderItems();
      await deleteFromFirebase(id);
    }

    // 效期計算與渲染
    function getExpiryStatus(item) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let deadlines = [];

      if (item.expDate) {
        deadlines.push(new Date(item.expDate));
      }
      if (item.openDate && item.pao > 0) {
        const paoDate = new Date(item.openDate);
        paoDate.setMonth(paoDate.getMonth() + item.pao);
        deadlines.push(paoDate);
      }
      if (deadlines.length === 0) return { status: 'normal', label: '' };

      const earliest = new Date(Math.min(...deadlines));
      const diffDays = Math.ceil((earliest - today) / (1000 * 60 * 60 * 24));
      const dateStr = earliest.toISOString().split('T')[0];

      if (diffDays < 0) return { status: 'expired', label: `已過期 (${dateStr})` };
      if (diffDays <= 60) return { status: 'expiring', label: `剩 ${diffDays} 天 (${dateStr})` };
      return { status: 'normal', label: `效期至 ${dateStr}` };
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'cat-tab px-3.5 py-1.5 rounded-full text-xs font-bold bg-rose-500 text-white shrink-0';
        } else {
          btn.className = 'cat-tab px-3.5 py-1.5 rounded-full text-xs font-medium bg-white text-slate-600 border border-slate-200 shrink-0';
        }
      });
      renderItems();
    }

    function setFilter(filter) {
      currentFilter = filter;
      renderItems();
    }

    function renderItems() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      let openedCount = 0, expiringCount = 0, lowCount = 0;

      inventory.forEach(item => {
        if (item.openDate) openedCount++;
        const exp = getExpiryStatus(item);
        if (exp.status === 'expired' || exp.status === 'expiring') expiringCount++;
        if (item.minQty !== null && item.minQty !== undefined && item.qty <= item.minQty) lowCount++;
      });

      document.getElementById('countAll').textContent = inventory.length;
      document.getElementById('countOpened').textContent = openedCount;
      document.getElementById('countExpiring').textContent = expiringCount;
      document.getElementById('countLow').textContent = lowCount;

      const filtered = inventory.filter(item => {
        if (currentCategory !== '全部' && item.category !== currentCategory) return false;
        const exp = getExpiryStatus(item);
        if (currentFilter === 'opened' && !item.openDate) return false;
        if (currentFilter === 'expiring' && exp.status === 'normal') return false;
        if (currentFilter === 'low' && !(item.minQty !== null && item.qty <= item.minQty)) return false;

        if (q) {
          const hay = `${item.brand} ${item.name} ${item.note} ${item.barcode}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const listEl = document.getElementById('itemList');
      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="bg-white rounded-3xl p-8 text-center border border-slate-100 space-y-2">
            <div class="text-3xl">🧴</div>
            <div class="text-sm font-bold text-slate-700">目前沒有符合條件的品項</div>
            <div class="text-xs text-slate-400">點擊右上角「+ 新增」，直接拍商品正面即可用 Gemini AI 自動建檔</div>
          </div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const exp = getExpiryStatus(item);
        const isLow = item.minQty !== null && item.minQty !== undefined && item.qty <= item.minQty;
        const expBadge = exp.status === 'expired'
          ? `<span class="px-2 py-0.5 rounded-md bg-rose-100 text-rose-700 font-bold">${exp.label}</span>`
          : exp.status === 'expiring'
          ? `<span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-700 font-bold">${exp.label}</span>`
          : exp.label ? `<span class="text-slate-400">${exp.label}</span>` : '';

        return `
          <div class="bg-white rounded-2xl p-3.5 border border-slate-100 shadow-xs flex gap-3 items-center">
            <div class="w-16 h-16 rounded-xl bg-rose-50/70 border border-rose-100 flex items-center justify-center overflow-hidden shrink-0">
              ${item.photo
                ? `<img src="${item.photo}" class="w-full h-full object-cover" alt="${item.name}" />`
                : `<i class="fa-solid fa-pump-soap text-rose-300 text-xl"></i>`}
            </div>

            <div class="flex-1 min-w-0 space-y-1">
              <div class="flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-bold">${item.category}</span>
                ${item.brand ? `<span class="text-xs font-bold text-rose-600 truncate">${item.brand}</span>` : ''}
              </div>
              <div class="text-sm font-bold text-slate-800 truncate">${item.name}</div>
              <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                ${item.openDate ? `<span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 font-medium">已開封</span>` : ''}
                ${isLow ? `<span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-600 font-bold">低庫存</span>` : ''}
                ${expBadge}
                ${item.note ? `<span class="text-slate-400 truncate">· ${item.note}</span>` : ''}
              </div>
            </div>

            <div class="flex flex-col items-end gap-2 shrink-0">
              <div class="flex items-center gap-1.5 bg-slate-50 rounded-xl p-1 border border-slate-200/70">
                <button onclick="adjustQty('${item.id}', -1)" class="w-6 h-6 rounded-lg bg-white text-slate-600 font-bold shadow-2xs">-</button>
                <span class="text-xs font-extrabold min-w-[2.2rem] text-center">${item.qty}${item.unit}</span>
                <button onclick="adjustQty('${item.id}', 1)" class="w-6 h-6 rounded-lg bg-white text-slate-600 font-bold shadow-2xs">+</button>
              </div>
              <div class="flex items-center gap-2 text-xs text-slate-400">
                <button onclick='openItemModal(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="hover:text-indigo-600"><i class="fa-solid fa-pen"></i></button>
                <button onclick="removeItem('${item.id}')" class="hover:text-rose-600"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    // 設定彈窗
    function openSettingsModal() {
      document.getElementById('settingWorkerUrl').value = localStorage.getItem('beauty_ai_worker_url') || DEFAULT_WORKER_URL;
      document.getElementById('settingFirebaseUrl').value = localStorage.getItem('beauty_fb_url') || '';
      document.getElementById('settingSpaceId').value = localStorage.getItem('beauty_space_id') || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveCloudSettings() {
      const wUrl = document.getElementById('settingWorkerUrl').value.trim() || DEFAULT_WORKER_URL;
      const fUrl = document.getElementById('settingFirebaseUrl').value.trim();
      const sId = document.getElementById('settingSpaceId').value.trim();

      localStorage.setItem('beauty_ai_worker_url', wUrl);
      localStorage.setItem('beauty_fb_url', fUrl);
      localStorage.setItem('beauty_space_id', sId);

      closeSettingsModal();
      syncFromFirebase();
    }
  </script>
</body>
</html>
