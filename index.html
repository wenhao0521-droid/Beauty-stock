<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e11d48" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="庫存管家" />
  <link rel="manifest" href="./manifest.json" />
  <title>美妝與日用品庫存管家</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body { font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 antialiased pb-20">

  <!-- 頂部導覽列（手機友善雙層橫向排版） -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-2.5">
    <div class="max-w-5xl mx-auto space-y-2.5">
      <!-- 第一層：橫向完整標題 + 雲端同步狀態 -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-rose-500 to-amber-500 flex items-center justify-center text-white shadow-sm shrink-0">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
          </div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900 truncate whitespace-nowrap">美妝與日用品庫存管家</h1>
        </div>

        <span id="sync-status-pill" onclick="openSyncModal()" class="cursor-pointer shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-500 border border-slate-200 flex items-center gap-1.5">
          <span id="sync-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="sync-label" class="max-w-[110px] truncate">單機模式</span>
        </span>
      </div>

      <!-- 第二層：功能快捷按鈕列 -->
      <div class="flex items-center justify-between gap-1.5">
        <div class="flex items-center gap-1.5">
          <button onclick="openSyncModal()" class="px-2.5 py-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-700 text-xs font-medium flex items-center gap-1 transition" title="多人雲端同步設定">
            <i data-lucide="cloud" class="w-4 h-4"></i>
            <span class="hidden xs:inline sm:inline">共享</span>
          </button>
          <button onclick="openShoppingModal()" class="relative px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium flex items-center gap-1 transition" title="智慧採購清單">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i>
            <span>採購</span>
            <span id="shopping-badge" class="hidden ml-0.5 px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[10px] font-bold">0</span>
          </button>
          <button onclick="openLogsModal()" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium flex items-center gap-1 transition" title="異動紀錄">
            <i data-lucide="history" class="w-4 h-4"></i>
            <span>紀錄</span>
          </button>
          <button onclick="openBackupModal()" class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium flex items-center gap-1 transition" title="備份與還原">
            <i data-lucide="database-backup" class="w-4 h-4"></i>
            <span>備份</span>
          </button>
        </div>

        <button onclick="openItemModal()" class="flex items-center gap-1 bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-medium px-3.5 py-1.5 rounded-xl shadow-sm shrink-0 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>新增</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-4 space-y-4">
    <!-- 儀表板數據卡片 -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <button onclick="setFilterStatus('all')" class="text-left bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm hover:border-slate-300 transition">
        <div class="flex items-center justify-between text-slate-500 mb-1">
          <span class="text-xs font-medium">總庫存件數</span>
          <span class="p-1.5 rounded-lg bg-slate-100 text-slate-600"><i data-lucide="package" class="w-4 h-4"></i></span>
        </div>
        <div id="stat-total-qty" class="text-2xl font-bold text-slate-900">0</div>
        <div id="stat-total-items" class="text-[11px] text-slate-400 mt-0.5">共 0 項商品</div>
      </button>

      <button onclick="setFilterStatus('expiring')" class="text-left bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm hover:border-amber-300 transition">
        <div class="flex items-center justify-between text-amber-600 mb-1">
          <span class="text-xs font-medium">即將過期 (30天內)</span>
          <span class="p-1.5 rounded-lg bg-amber-50 text-amber-600"><i data-lucide="clock" class="w-4 h-4"></i></span>
        </div>
        <div id="stat-expiring" class="text-2xl font-bold text-amber-600">0</div>
        <div class="text-[11px] text-slate-400 mt-0.5">含開封後PAO效期</div>
      </button>

      <button onclick="setFilterStatus('expired')" class="text-left bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm hover:border-rose-300 transition">
        <div class="flex items-center justify-between text-rose-600 mb-1">
          <span class="text-xs font-medium">已過期提醒</span>
          <span class="p-1.5 rounded-lg bg-rose-50 text-rose-600"><i data-lucide="alert-triangle" class="w-4 h-4"></i></span>
        </div>
        <div id="stat-expired" class="text-2xl font-bold text-rose-600">0</div>
        <div class="text-[11px] text-slate-400 mt-0.5">請盡快檢查汰換</div>
      </button>

      <button onclick="setFilterStatus('low')" class="text-left bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm hover:border-blue-300 transition">
        <div class="flex items-center justify-between text-blue-600 mb-1">
          <span class="text-xs font-medium">低庫存需補貨</span>
          <span class="p-1.5 rounded-lg bg-blue-50 text-blue-600"><i data-lucide="shopping-bag" class="w-4 h-4"></i></span>
        </div>
        <div id="stat-low" class="text-2xl font-bold text-blue-600">0</div>
        <div class="text-[11px] text-slate-400 mt-0.5">低於已設安全庫存</div>
      </button>
    </section>

    <!-- 空瓶記帳成就橫幅 -->
    <section class="bg-gradient-to-r from-rose-50 via-amber-50 to-orange-50 border border-rose-100 rounded-2xl p-3.5 flex items-center justify-between">
      <div>
        <div class="text-xs font-semibold text-rose-700">空瓶記帳成就</div>
        <div class="flex items-baseline gap-1.5 mt-0.5">
          <span id="stat-empties" class="text-2xl font-bold text-rose-600">0</span>
          <span class="text-xs text-rose-500 font-medium">瓶/件</span>
        </div>
        <div class="text-[11px] text-amber-700/80 mt-0.5">持續消耗不浪費 ✨</div>
      </div>
      <div class="w-10 h-10 rounded-full bg-white/80 flex items-center justify-center text-rose-500 shadow-sm">
        <i data-lucide="award" class="w-5 h-5"></i>
      </div>
    </section>

    <!-- 分類與搜尋工具列 -->
    <section class="space-y-2.5">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
        <button onclick="setCategory('全部')" data-cat="全部" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-white shrink-0 transition">全部品項</button>
        <button onclick="setCategory('保養品')" data-cat="保養品" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 shrink-0 transition">✨ 保養品</button>
        <button onclick="setCategory('化妝品')" data-cat="化妝品" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 shrink-0 transition">💄 化妝品</button>
        <button onclick="setCategory('日用品')" data-cat="日用品" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 shrink-0 transition">🧴 日用品</button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
        <div class="sm:col-span-5 relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input id="search-input" type="text" oninput="renderItems()" placeholder="搜尋中/日/英品牌、品名或條碼..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-slate-400" />
        </div>
        <div class="sm:col-span-3">
          <select id="filter-status" onchange="renderItems()" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none">
            <option value="all">所有狀態</option>
            <option value="expiring">即將過期 (30天內)</option>
            <option value="expired">已過期</option>
            <option value="low">低庫存補貨</option>
            <option value="opened">已開封追蹤中</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <select id="filter-location" onchange="renderItems()" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none">
            <option value="all">所有位置</option>
            <option value="浴室鏡櫃">浴室鏡櫃</option>
            <option value="化妝台">化妝台</option>
            <option value="囤貨箱">囤貨箱</option>
            <option value="客廳儲藏室">客廳儲藏室</option>
            <option value="隨身化妝包">隨身化妝包</option>
          </select>
        </div>
        <div class="sm:col-span-2">
          <select id="filter-owner" onchange="renderItems()" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none">
            <option value="all">所有成員</option>
            <option value="自己">自己</option>
            <option value="家人共用">家人共用</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 商品列表網格 -->
    <section id="items-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5"></section>
  </main>

  <!-- 新增/編輯商品 Modal -->
  <div id="item-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[92vh] overflow-y-auto p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 id="modal-title" class="text-lg font-bold text-slate-900">新增庫存品項</h2>
        <button onclick="closeItemModal()" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-500">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 智慧掃碼 + 拍照辨識雙工具列 -->
      <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 space-y-2.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <span class="text-xs font-semibold text-slate-700 block">智慧條碼查詢 & 瓶身辨識</span>
            <span class="text-[11px] text-slate-400">支援台日電商條碼自動搜尋與包裝 OCR 拆解</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button type="button" onclick="toggleCameraScanner()" class="px-3 py-1.5 rounded-xl bg-rose-600 text-white text-xs font-medium flex items-center gap-1.5 hover:bg-rose-700 shadow-xs">
              <i data-lucide="scan-barcode" class="w-4 h-4"></i>
              <span id="cam-btn-text">掃條碼</span>
            </button>
            <label class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-xs font-medium flex items-center gap-1.5 hover:opacity-95 shadow-xs cursor-pointer">
              <i data-lucide="camera" class="w-4 h-4"></i>
              <span>拍瓶身辨識</span>
              <input id="ocr-photo-input" type="file" accept="image/*" capture="environment" onchange="handleOfflineOcrCapture(event)" class="hidden" />
            </label>
          </div>
        </div>

        <div id="qr-reader" class="hidden rounded-xl overflow-hidden border border-slate-200 bg-black"></div>

        <!-- 辨識與查詢狀態提示列 -->
        <div id="barcode-status-box" class="hidden rounded-xl p-2.5 text-xs space-y-2"></div>
      </div>

      <form id="item-form" onsubmit="saveItem(event)" class="space-y-3.5">
        <input type="hidden" id="item-id" />
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">商品分類 *</label>
            <select id="item-category" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
              <option value="保養品">保養品</option>
              <option value="化妝品">化妝品</option>
              <option value="日用品">日用品</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">條碼編號</label>
            <div class="flex gap-1">
              <input id="item-barcode" type="text" placeholder="掃描或輸入條碼" class="w-full px-2.5 py-2 border border-slate-200 rounded-xl text-sm" />
              <button type="button" onclick="manualLookupBarcode()" class="px-2.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium shrink-0" title="查詢此條碼">查詢</button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-medium text-slate-600">品牌名稱</label>
              <button type="button" onclick="swapBrandAndName()" class="text-[11px] text-indigo-600 hover:underline flex items-center gap-0.5" title="若品牌與品名顛倒可一鍵互換">⇄ 互換</button>
            </div>
            <input id="item-brand" type="text" placeholder="例：SHISEIDO、肌研" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">商品名稱 *</label>
            <input id="item-name" type="text" required placeholder="例：極潤ヒアルロン液 170ml" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">目前數量 *</label>
            <input id="item-qty" type="number" min="0" value="1" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">安全庫存 (選填)</label>
            <input id="item-min-qty" type="number" min="0" placeholder="不提醒" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">單位</label>
            <input id="item-unit" type="text" value="瓶" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">出廠有效期限</label>
            <input id="item-expiry" type="date" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">開封後保質期 (PAO)</label>
            <select id="item-pao" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
              <option value="0">不限 / 未標示</option>
              <option value="3">3 個月 (3M)</option>
              <option value="6">6 個月 (6M)</option>
              <option value="12" selected>12 個月 (12M)</option>
              <option value="18">18 個月 (18M)</option>
              <option value="24">24 個月 (24M)</option>
            </select>
          </div>
        </div>

        <div class="bg-amber-50/70 border border-amber-200/70 rounded-xl p-3 space-y-2">
          <label class="flex items-center gap-2 text-xs font-semibold text-amber-900 cursor-pointer">
            <input id="item-opened" type="checkbox" onchange="toggleOpenedDateInput()" class="rounded text-rose-600" />
            <span>此商品已開封使用（啟用 PAO 倒數計時）</span>
          </label>
          <div id="opened-date-wrap" class="hidden">
            <label class="block text-[11px] text-amber-800 mb-1">開封日期</label>
            <input id="item-opened-date" type="date" class="w-full px-3 py-1.5 bg-white border border-amber-200 rounded-lg text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">存放位置</label>
            <select id="item-location" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
              <option value="浴室鏡櫃">浴室鏡櫃</option>
              <option value="化妝台">化妝台</option>
              <option value="囤貨箱">囤貨箱</option>
              <option value="客廳儲藏室">客廳儲藏室</option>
              <option value="隨身化妝包">隨身化妝包</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">使用成員</label>
            <select id="item-owner" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
              <option value="自己">自己</option>
              <option value="家人共用">家人共用</option>
            </select>
          </div>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeItemModal()" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50">取消</button>
          <button type="submit" class="flex-1 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-medium hover:bg-slate-800">儲存品項</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase 多人即時同步設定 Modal -->
  <div id="sync-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-lg font-bold text-slate-900">多人即時雲端同步 (Firebase)</h2>
        <button onclick="closeSyncModal()" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div class="bg-sky-50 border border-sky-200/80 rounded-2xl p-3 text-xs text-sky-900 space-y-1.5 leading-relaxed">
        <div class="font-semibold">如何與家人共享同一份庫存？</div>
        <p>1. 在兩支手機分別貼上同一份 <strong>Firebase Config 設定碼</strong> 與自訂的<strong>家庭共享代碼</strong>（請用英文或連字號，勿含空格）。</p>
        <p>2. 任一方新增、消耗或空瓶，另一方畫面會在 1 秒內自動即時更新。</p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">1. 家庭共享空間代碼 (例：Beauty--stock)</label>
          <input id="sync-room-id" type="text" placeholder="例：Beauty--stock" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">2. 貼上 Firebase Config（從 Firebase 專案設定複製整段即可）</label>
          <textarea id="sync-firebase-config" rows="6" placeholder='const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "xxx.firebaseapp.com",
  databaseURL: "https://xxx.firebasedatabase.app",
  projectId: "xxx",
  ...
};' class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:border-sky-400"></textarea>
        </div>

    function isItemLowStock(item) {
      if (item.minQty === '' || item.minQty === null || item.minQty === undefined) return false;
      const minVal = Number(item.minQty);
      if (Number.isNaN(minVal)) return false;
      return Number(item.qty) <= minVal;
    }

    // 清洗台日電商與日本藥妝網站標題並自動拆出品牌與品名
    function parseBrandAndNameFromTitle(rawTitle) {
      if (!rawTitle) return { brand: '', name: '', category: '' };

      // 1. 移除常見台日電商平台後綴、條碼庫後綴與促銷括號標籤
      let cleaned = rawTitle
        .replace(/\s*[-|｜_・]\s*(momo購物網|蝦皮購物|PChome.*|康是美.*|屈臣氏.*|博客來.*|楽天市場|Amazon\.co\.jp|@cosme.*|Yahoo!.*|LINE購物|ヨドバシ\.com|マツキヨココカラ.*|サンドラッグ.*|JANコード.*|JANCODE.*).*$/i, '')
        .replace(/【(官方直營|熱銷|限時|買一送一|免運|任選|公司貨|正品|日本原裝|超值組|特惠組|現貨|預購|滿額贈|折扣|第[123]類医薬品)】/g, '')
        .replace(/\[(官方直營|熱銷|限時|買一送一|免運|任選|公司貨|正品|現貨|第[123]類医薬品)\]/g, '')
        .replace(/\s+/g, ' ')
        .trim();

      let detectedBrand = '';
      let matchedKey = '';

      // 2. 優先檢查【品牌名稱】或 [品牌名稱] 格式
      const bracketMatch = cleaned.match(/^[【\[]([^】\]]{1,20})[】\]]\s*(.+)$/);
      if (bracketMatch) {
        const candidate = bracketMatch[1].trim();
        const rest = bracketMatch[2].trim();
        if (!/(特價|組合|優惠|團購|福利|新品|組合價|單入|多入)/.test(candidate)) {
          detectedBrand = candidate;
          cleaned = rest;
        }
      }

      // 3. 比對自學習品牌與內建台日美妝品牌字典
      const upperTitle = cleaned.toUpperCase();
      if (!detectedBrand) {
        for (const cb of customBrands) {
          if (cb && upperTitle.includes(cb.toUpperCase())) {
            detectedBrand = cb;
            matchedKey = cb;
            break;
          }
        }
      }
      if (!detectedBrand) {
        for (const entry of BRAND_DICTIONARY) {
          const hit = entry.keys.find(k => upperTitle.includes(k.toUpperCase()));
          if (hit) {
            detectedBrand = entry.brand;
            matchedKey = hit;
            break;
          }
        }
      }

      // 4. 若標題開頭重複了品牌字眼，幫品名瘦身
      let finalName = cleaned;
      if (matchedKey) {
        const escaped = matchedKey.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const stripped = finalName.replace(new RegExp(`^${escaped}[\\s/・-]*`, 'i'), '').trim();
        if (stripped.length >= 2) finalName = stripped;
      }

      // 自動猜測分類
      let category = '';
      if (/口紅|唇膏|唇釉|粉底|氣墊|粉餅|遮瑕|眉筆|眼影|睫毛膏|腮紅|隔離霜|妝前乳|定妝|蜜粉|リップ|ファンデーション|パウダー|アイシャドウ|マスカラ|チーク|下地/i.test(finalName)) {
        category = '化妝品';
      } else if (/洗髮|沐浴|牙膏|牙刷|洗衣|衛生紙|濕紙巾|洗手|洗碗|清潔|芳香|除濕|衛生棉|護墊|眼藥水|目薬|シャンプー|トリートメント|ボディソープ|歯磨き|洗剤|柔軟剤/i.test(finalName)) {
        category = '日用品';
      } else if (/化妝水|精華|乳液|面霜|修復霜|防曬|卸妝|洗面|潔顏|面膜|眼霜|凝露|化粧水|美容液|クリーム|日焼け止め|クレンジング|洗顔|パック/i.test(finalName)) {
        category = '保養品';
      }

      return { brand: detectedBrand, name: finalName.slice(0, 80), category };
    }

      saveLocalCacheOnly();
      renderAll();

      if (dbRef && !isRemoteUpdating) {
        dbRef.set({
          items,
          logs,
          emptiesCount,
          customBarcodeDict,
          customBrands,
          updatedAt: Date.now()

          console.error('Firebase sync write error:', err);
          updateSyncBadge('error', '同步異常');
        });
      }
    }

    function updateSyncBadge(state, text) {
      const pill = document.getElementById('sync-status-pill');
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      label.textContent = text;
      if (state === 'connected') {
        pill.className = 'cursor-pointer shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1.5';
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
      } else if (state === 'error') {
        pill.className = 'cursor-pointer shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-rose-50 text-rose-700 border border-rose-200 flex items-center gap-1.5';
        dot.className = 'w-2 h-2 rounded-full bg-rose-500';
      } else {
        pill.className = 'cursor-pointer shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-500 border border-slate-200 flex items-center gap-1.5';
        dot.className = 'w-2 h-2 rounded-full bg-slate-400';
      }
    }

    function parseFirebaseConfigInput(rawText) {
      const braceMatch = rawText.match(/\{[\s\S]*\}/);
      if (!braceMatch) throw new Error('找不到 { ... } 設定區塊，請確認有複製大括號內的設定碼。');
      return new Function('return (' + braceMatch[0] + ')')();
    }

    function initFirebaseSync(configObj, roomId, isInitialSetup = false) {
      try {
        if (!configObj || typeof configObj !== 'object') {
          throw new Error('設定碼格式不正確');
        }
        if (!configObj.databaseURL && configObj.projectId) {
          configObj.databaseURL = `https://${configObj.projectId}-default-rtdb.asia-southeast1.firebasedatabase.app`;
        }
        if (!configObj.databaseURL) {
          throw new Error('設定碼中缺少 databaseURL，請確認已在 Firebase 啟用 Realtime Database。');
        }
        const safeRoom = roomId.trim().replace(/\s+/g, '-').replace(/[^a-zA-Z0-9_-]/g, '');
        if (!safeRoom) {
          throw new Error('家庭共享空間代碼請輸入英文字母或數字（例如 Beauty--stock）。');
        }

        if (firebase.apps.length) {
          firebase.apps.forEach(app => app.delete().catch(() => {}));
        }
        const app = firebase.initializeApp(configObj);
        const database = firebase.database(app);
        dbRef = database.ref(`beauty_stock_rooms/${safeRoom}`);

        updateSyncBadge('connected', `已同步：${safeRoom}`);

        dbRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (!val) {
            if (isInitialSetup || items.length > 0) {
              dbRef.set({
                items,
                logs,
                emptiesCount,
                customBarcodeDict,
                customBrands,
                updatedAt: Date.now()
              });
            }
            return;
          }

          isRemoteUpdating = true;
          items = Array.isArray(val.items) ? val.items : [];
          logs = Array.isArray(val.logs) ? val.logs : [];
          emptiesCount = Number(val.emptiesCount || 0);
          customBarcodeDict = val.customBarcodeDict || {};
          customBrands = Array.isArray(val.customBrands) ? val.customBrands : [];
          saveLocalCacheOnly();
          renderAll();
          isRemoteUpdating = false;
        }, (err) => {
          updateSyncBadge('error', '權限或連線錯誤');
          alert('Firebase 連線失敗：' + err.message);
        });

        return safeRoom;
      } catch (e) {
        updateSyncBadge('error', '設定格式錯誤');

    function preprocessImageForOcr(file, maxDim = 1280) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.filter = 'contrast(1.25) grayscale(1)';
            ctx.drawImage(img, 0, 0, w, h);
            resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.9), imgHeight: h });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function analyzeOcrStructure(ocrData, imgHeight) {
      const rawLines = ocrData?.lines || [];
      const PRODUCT_TYPE_REGEX = /(化妝水|精華|乳液|面霜|修復霜|防曬|卸妝|洗面|潔顏|面膜|眼霜|凝露|口紅|唇膏|唇釉|粉底|氣墊|粉餅|遮瑕|眉筆|眼影|睫毛膏|腮紅|隔離霜|妝前乳|定妝|蜜粉|洗髮|沐浴|牙膏|牙刷|洗衣|衛生紙|濕紙巾|洗手|洗碗|清潔|芳香|除濕|衛生棉|護墊|化粧水|美容液|クリーム|日焼け止め|クレンジング|洗顔|パック|リップ|ファンデーション|パウダー|シャンプー|トリートメント|ボディソープ|歯磨き|洗剤|LOTION|SERUM|ESSENCE|CREAM|EMULSION|SUNSCREEN|CLEANSER|MASK|BAUME|BALM|GEL|TONER|LIP|FOUNDATION|MASCARA|POWDER|SHAMPOO|CONDITIONER|WASH)/i;
      const SPEC_ONLY_REGEX = /^(\d+\s*(ml|g|mg|oz|片|入|抽|枚)|SPF\d+|PA\++|NET\s*WT\.?)$/i;

      const structured = rawLines
        .map(l => {
          const text = (l.text || '').replace(/[|｜_~`^<>[\]{}]/g, '').replace(/\s+/g, ' ').trim();
          const bbox = l.bbox || { y0: 0, y1: 20 };
          const height = Math.max(1, bbox.y1 - bbox.y0);
          const relTop = imgHeight > 0 ? bbox.y0 / imgHeight : 0.5;
          return { text, height, relTop };
        })
        .filter(item => item.text.length >= 2 && !/^[\d\s.,/-]+$/.test(item.text));

      let detectedBrand = '';
      let matchedBrandKey = '';

      const allTextUpper = structured.map(s => s.text).join(' ').toUpperCase();
      for (const cb of customBrands) {
        if (cb && allTextUpper.includes(cb.toUpperCase())) {
          detectedBrand = cb;
          matchedBrandKey = cb.toUpperCase();
          break;
        }
      }
      if (!detectedBrand) {
        for (const entry of BRAND_DICTIONARY) {
          const hit = entry.keys.find(k => allTextUpper.includes(k.toUpperCase()));
          if (hit) {
            detectedBrand = entry.brand;
            matchedBrandKey = hit.toUpperCase();
            break;
          }
        }
      }

      if (!detectedBrand && structured.length >= 2) {
        const brandCandidate = structured.find(s =>
          s.relTop < 0.38 &&
          s.text.length <= 22 &&
          !PRODUCT_TYPE_REGEX.test(s.text) &&
          !SPEC_ONLY_REGEX.test(s.text)
        );
        if (brandCandidate) {
          detectedBrand = brandCandidate.text;
          matchedBrandKey = brandCandidate.text.toUpperCase();
        }
      }

      const nameCandidates = structured.filter(s => {
        const up = s.text.toUpperCase();
        if (matchedBrandKey && (up === matchedBrandKey || (matchedBrandKey.length >= 4 && up.includes(matchedBrandKey) && s.text.length <= matchedBrandKey.length + 3))) {
          return false;
        }
        if (SPEC_ONLY_REGEX.test(s.text)) return false;
        return true;
      });

      const scoredNames = [...nameCandidates].sort((a, b) => {
        const scoreA = a.height + (PRODUCT_TYPE_REGEX.test(a.text) ? 40 : 0);
        const scoreB = b.height + (PRODUCT_TYPE_REGEX.test(b.text) ? 40 : 0);
        return scoreB - scoreA;
      });

      const primaryName = scoredNames[0]?.text || '';
      const secondarySpec = structured.find(s => /\d+\s*(ml|g|片|入|枚)/i.test(s.text) && !primaryName.includes(s.text))?.text || '';
      const suggestedName = [primaryName, secondarySpec].filter(Boolean).join(' ').slice(0, 65);

      const joined = structured.map(s => s.text).join(' ');
      let detectedCategory = '';
      if (/口紅|唇膏|唇釉|粉底|氣墊|粉餅|遮瑕|眉筆|眼影|睫毛膏|腮紅|隔離霜|妝前乳|定妝|蜜粉|リップ|ファンデーション|パウダー|アイシャドウ|マスカラ|チーク|下地|LIP|FOUNDATION|MASCARA|POWDER|BLUSH/i.test(joined)) {
        detectedCategory = '化妝品';
      } else if (/洗髮|沐浴|牙膏|牙刷|洗衣|衛生紙|濕紙巾|洗手|洗碗|清潔|芳香|除濕|衛生棉|護墊|眼藥水|目薬|シャンプー|トリートメント|ボディソープ|歯磨き|洗剤|柔軟剤|SHAMPOO|CONDITIONER|BODY WASH|TOOTHPASTE|DETERGENT/i.test(joined)) {
        detectedCategory = '日用品';
      } else if (PRODUCT_TYPE_REGEX.test(joined)) {
        detectedCategory = '保養品';
      }

      return {
        detectedBrand,
        suggestedName,
        detectedCategory,
        lines: structured.map(s => s.text).slice(0, 10)
      };
    }

    async function handleOfflineOcrCapture(event) {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;

      const statusBox = document.getElementById('barcode-status-box');
      statusBox.classList.remove('hidden');
      statusBox.className = 'rounded-xl p-2.5 text-xs bg-emerald-50 text-emerald-900 border border-emerald-200 flex items-center gap-2';
      statusBox.innerHTML = `<span class="animate-spin inline-block w-3.5 h-3.5 border-2 border-emerald-600 border-t-transparent rounded-full shrink-0"></span> <span id="ocr-progress-text">正在啟動中/日/英離線文字辨識引擎...</span>`;

      try {
        const { dataUrl, imgHeight } = await preprocessImageForOcr(file);
        const result = await Tesseract.recognize(
          dataUrl,
          'chi_tra+jpn+eng',
          {
            logger: (m) => {
              const progEl = document.getElementById('ocr-progress-text');
              if (!progEl) return;
              if (m.status === 'recognizing text') {
                progEl.textContent = `正在分析包裝版面與文字... ${Math.round((m.progress || 0) * 100)}%`;
              } else if (m.status && m.status.includes('loading')) {
                progEl.textContent = `正在載入中/日/英語料庫（僅首次需要，之後全離線秒開）...`;
              }
            }
          }
        );

        const parsed = analyzeOcrStructure(result?.data, imgHeight);
        lastOcrLines = parsed.lines;

        if (parsed.detectedCategory) {
          document.getElementById('item-category').value = parsed.detectedCategory;
        }
        if (parsed.detectedBrand) {
          document.getElementById('item-brand').value = parsed.detectedBrand;
        }
        if (parsed.suggestedName) {
          document.getElementById('item-name').value = parsed.suggestedName;
        }

        if (parsed.lines.length > 0) {
          const chipsHtml = parsed.lines.map((line, idx) => `
            <div class="inline-flex items-center rounded-lg bg-white border border-emerald-300 overflow-hidden text-[11px]">
              <span class="px-2 py-1 text-slate-800 max-w-[155px] truncate">${line}</span>
              <button type="button" onclick="setOcrToField(${idx}, 'brand')" class="px-1.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 border-l border-emerald-200 font-medium" title="設為品牌">品牌</button>
              <button type="button" onclick="setOcrToField(${idx}, 'name')" class="px-1.5 py-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border-l border-emerald-200 font-medium" title="加入品名">+品名</button>
            </div>
          `).join('');

          statusBox.className = 'rounded-xl p-2.5 text-xs bg-emerald-50 text-emerald-900 border border-emerald-200 space-y-2';
          statusBox.innerHTML = `
            <div>✅ <strong>已完成品牌與品名自動拆解！</strong>若需微調，可點上方「⇄ 互換」或點選下方字樣指定：</div>
            <div class="flex flex-wrap gap-1.5">${chipsHtml}</div>
          `;
        } else {
          statusBox.className = 'rounded-xl p-2.5 text-xs bg-amber-50 text-amber-900 border border-amber-200';
          statusBox.innerHTML = `⚠️ 照片反光或字體較小未抓到清晰字樣，建議靠近包裝文字區重拍一次，或直接輸入原文品名。`;
        }
      } catch (err) {
        statusBox.className = 'rounded-xl p-2.5 text-xs bg-rose-50 text-rose-800 border border-rose-200';
        statusBox.innerHTML = `❌ 辨識過程發生錯誤，請確認網路暢通（首次使用需載入語言包）後再試一次。`;
      }
    }

    function setOcrToField(idx, target) {
      const text = lastOcrLines[idx];

    // 透過 Google Custom Search API 查詢台日商品標題（支援自動附加 JAN / 商品 關鍵字備援搜尋）
    async function queryGoogleCseOnce(searchQuery) {
      const endpoint = `https://www.googleapis.com/customsearch/v1?key=${encodeURIComponent(GOOGLE_CSE_API_KEY)}&cx=${encodeURIComponent(GOOGLE_CSE_CX)}&q=${encodeURIComponent(searchQuery)}&num=3`;
      const res = await fetch(endpoint);
      if (!res.ok) return null;
      const data = await res.json();
      if (data.items && data.items.length > 0) {
        const bestItem = data.items.find(it => it.title && it.title.replace(/\d+/g, '').trim().length >= 4) || data.items[0];
        const parsed = parseBrandAndNameFromTitle(bestItem.title);
        if (parsed.name || parsed.brand) {
          return {
            brand: parsed.brand,
            name: parsed.name,
            category: parsed.category,
            source: 'Google 智慧搜尋'
          };
        }
      }
      return null;
    }

    async function fetchProductFromGoogleCse(cleanCode) {
      if (!GOOGLE_CSE_API_KEY || !GOOGLE_CSE_CX) return null;
      try {
        // 第一輪：直接用純條碼查詢
        const directHit = await queryGoogleCseOnce(cleanCode);
        if (directHit) return directHit;

        // 第二輪：若未命中，針對日本條碼 (45/49) 附加 JAN 關鍵字，其餘附加 商品 關鍵字以提高命中率
        const fallbackSuffix = /^(45|49)/.test(cleanCode) ? 'JAN' : '商品';
        const fallbackHit = await queryGoogleCseOnce(`${cleanCode} ${fallbackSuffix}`);
        if (fallbackHit) return fallbackHit;
      } catch (e) {
        console.warn('Google CSE lookup failed:', e);
      }
      return null;
    }

    async function fetchProductFromApis(cleanCode) {
      // 1. 優先使用 Google Custom Search 抓取台日電商與日本藥妝商品標題
      const googleHit = await fetchProductFromGoogleCse(cleanCode);
      if (googleHit) return googleHit;

      // 2. 備援：查詢 Open Beauty / Products / Food Facts
      const openFactsUrls = [
        `https://world.openbeautyfacts.org/api/v2/product/${cleanCode}.json`,
        `https://world.openproductsfacts.org/api/v2/product/${cleanCode}.json`,
        `https://world.openfoodfacts.org/api/v2/product/${cleanCode}.json`
      ];

      for (const url of openFactsUrls) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const data = await res.json();
          if (data.status === 1 && data.product) {
            const p = data.product;
            const pName = p.product_name_ja || p.product_name_zh || p.product_name_tw || p.product_name || p.generic_name || '';
            const pBrand = p.brands ? p.brands.split(',')[0].trim() : '';
            if (pName || pBrand) return { brand: pBrand, name: pName, source: 'OpenBeautyFacts' };
          }
        } catch {}
      }

      // 3. 備援：UPCitemdb
      try {
        const res = await fetch(`https://api.upcitemdb.com/prod/trial/lookup?upc=${cleanCode}`);
        if (res.ok) {
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            const item = data.items[0];
            if (item.title || item.brand) {
              return { brand: item.brand || '', name: item.title || '', source: 'UPCitemdb' };
            }
          }
        }
      } catch {}

      return null;
    }

    async function lookupBarcodeInfo(code) {
      const cleanCode = code.trim();
      if (!cleanCode) return;
      document.getElementById('item-barcode').value = cleanCode;

      const statusBox = document.getElementById('barcode-status-box');

      statusBox.innerHTML = `<span class="animate-spin inline-block w-3.5 h-3.5 border-2 border-blue-600 border-t-transparent rounded-full"></span> 正在搜尋台日商品資料庫與雲端記憶庫 (${cleanCode})...`;

      // 第一層：Firebase 雲端與本機共享記憶庫
      const localMem = customBarcodeDict[cleanCode] || items.find(i => i.barcode === cleanCode);
      if (localMem) {
        document.getElementById('item-category').value = localMem.category || '保養品';

        statusBox.innerHTML = `✅ <strong>已從共享記憶庫帶入：</strong>${localMem.brand ? localMem.brand + ' ' : ''}${localMem.name}`;
        return;
      }

      // 第二層：Google 自訂搜尋 & 開放資料庫
      const found = await fetchProductFromApis(cleanCode);
      if (found && (found.brand || found.name)) {
        if (found.category) document.getElementById('item-category').value = found.category;
        if (found.brand) document.getElementById('item-brand').value = found.brand;
        if (found.name) document.getElementById('item-name').value = found.name;
        statusBox.className = 'rounded-xl p-2.5 text-xs bg-emerald-50 text-emerald-800 border border-emerald-200';
        statusBox.innerHTML = `✨ <strong>已透過 ${found.source} 自動帶入！</strong>（若品牌與品名有微調需求可點「⇄ 互換」，儲存後即永久同步給全家人）`;
        return;
      }

      // 第三層：引導使用拍瓶身 OCR
      statusBox.className = 'rounded-xl p-2.5 text-xs bg-amber-50 text-amber-900 border border-amber-200';
      statusBox.innerHTML = `⚠️ 網路暫無條碼 <strong>${cleanCode}</strong> 的公開頁面，請直接點擊上方綠色的 <strong>「拍瓶身辨識」</strong> 拍包裝上的品名，儲存後即可永久綁定此條碼！`;
    }

    function getEffectiveExpiry(item) {
      let dates = [];
      if (item.expiry) dates.push({ date: new Date(item.expiry), source: '出廠效期' });
      if (item.opened && item.openedDate && Number(item.pao) > 0) {
        const d = new Date(item.openedDate);
        d.setMonth(d.getMonth() + Number(item.pao));
        dates.push({ date: d, source: `開封PAO(${item.pao}M)` });
      }
      if (!dates.length) return null;
      dates.sort((a, b) => a.date - b.date);
      const chosen = dates[0];
      const diffDays = Math.ceil((chosen.date - new Date().setHours(0,0,0,0)) / 86400000);
      return {
        dateStr: chosen.date.toISOString().split('T')[0],
        source: chosen.source,
        diffDays
      };
    }

    function renderAll() {
      let totalQty = 0, expiringCount = 0, expiredCount = 0, lowCount = 0;

      items.forEach(item => {
        totalQty += Number(item.qty);
        const eff = getEffectiveExpiry(item);
        if (eff) {
          if (eff.diffDays < 0) expiredCount++;
          else if (eff.diffDays <= 30) expiringCount++;
        }
        if (isItemLowStock(item)) lowCount++;
      });

      document.getElementById('stat-total-qty').textContent = totalQty;
      document.getElementById('stat-total-items').textContent = `共 ${items.length} 項商品`;
      document.getElementById('stat-expiring').textContent = expiringCount;
      document.getElementById('stat-expired').textContent = expiredCount;
      document.getElementById('stat-low').textContent = lowCount;
      document.getElementById('stat-empties').textContent = emptiesCount;

      const shoppingNeed = items.filter(i => isItemLowStock(i) || (getEffectiveExpiry(i)?.diffDays ?? 999) < 0).length;
      const badge = document.getElementById('shopping-badge');
      badge.textContent = shoppingNeed;
      badge.classList.toggle('hidden', shoppingNeed === 0);

      renderItems();
    }

    function renderItems() {
      const keyword = document.getElementById('search-input').value.trim().toLowerCase();
      const statusFilter = document.getElementById('filter-status').value;
      const locFilter = document.getElementById('filter-location').value;
      const ownerFilter = document.getElementById('filter-owner').value;

      const filtered = items.filter(item => {
        if (currentCategory !== '全部' && item.category !== currentCategory) return false;
        if (locFilter !== 'all' && item.location !== locFilter) return false;
        if (ownerFilter !== 'all' && item.owner !== ownerFilter) return false;
        if (keyword) {
          const hay = `${item.brand} ${item.name} ${item.barcode}`.toLowerCase();
          if (!hay.includes(keyword)) return false;
        }
        const eff = getEffectiveExpiry(item);
        if (statusFilter === 'expired' && (!eff || eff.diffDays >= 0)) return false;
        if (statusFilter === 'expiring' && (!eff || eff.diffDays < 0 || eff.diffDays > 30)) return false;
        if (statusFilter === 'low' && !isItemLowStock(item)) return false;
        if (statusFilter === 'opened' && !item.opened) return false;
        return true;
      });

      const grid = document.getElementById('items-grid');
      if (!filtered.length) {
        grid.innerHTML = `<div class="col-span-full bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-400 text-sm">目前沒有符合條件的庫存品項，點擊右上角「新增」體驗掃條碼建檔吧！</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const eff = getEffectiveExpiry(item);
        const isLow = isItemLowStock(item);
        let expiryBadge = `<span class="text-[11px] text-slate-400">未設定效期</span>`;

        if (eff) {
          if (eff.diffDays < 0) {
            expiryBadge = `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-rose-100 text-rose-700">已過期 ${Math.abs(eff.diffDays)} 天 (${eff.source})</span>`;
          } else if (eff.diffDays <= 30) {
            expiryBadge = `<span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 text-amber-800">剩 ${eff.diffDays} 天到期 (${eff.source})</span>`;
          } else {
            expiryBadge = `<span class="text-[11px] text-slate-500">效期 ${eff.dateStr} (${eff.source})</span>`;
          }
        }

        return `
          <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm flex flex-col justify-between space-y-3">
            <div class="space-y-2">
              <div class="flex items-start justify-between gap-2">
                <div class="flex flex-wrap items-center gap-1.5">
                  <span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-100 text-slate-600">${item.category}</span>
                  <span class="px-2 py-0.5 rounded-md text-[11px] bg-slate-50 text-slate-500 border border-slate-200/70">${item.location}</span>
                  <span class="px-2 py-0.5 rounded-md text-[11px] bg-slate-50 text-slate-500 border border-slate-200/70">${item.owner}</span>
                  ${isLow ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-medium bg-blue-100 text-blue-700">低庫存</span>` : ''}
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button onclick="openItemModal('${item.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                  <button onclick="deleteItem('${item.id}')" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
              </div>

              <div>
                <div class="text-xs text-slate-400 font-medium">${item.brand || '未標示品牌'}</div>
                <h3 class="text-base font-bold text-slate-900 leading-snug">${item.name}</h3>
              </div>

              <div class="flex items-center justify-between pt-1">
                <div>${expiryBadge}</div>
                <div class="text-right">
                  <span class="text-xl font-bold ${isLow ? 'text-blue-600' : 'text-slate-900'}">${item.qty}</span>
                  <span class="text-xs text-slate-500">${item.unit}</span>
                </div>
              </div>
            </div>

            <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between gap-1.5">
              ${!item.opened ? `<button onclick="markOpened('${item.id}')" class="px-2.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-medium transition">標記今日開封</button>` : `<span class="text-[11px] text-emerald-600 font-medium">● 已於 ${item.openedDate} 開封</span>`}
              <div class="flex items-center gap-1 ml-auto">
                <button onclick="recordEmpty('${item.id}')" class="px-2 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-medium transition" title="用完一瓶並累計空瓶成就">空瓶</button>
                <button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm flex items-center justify-center">-1</button>
                <button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm flex items-center justify-center">+1</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const active = btn.dataset.cat === cat;
        btn.className = active
          ? 'cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-slate-900 text-white shrink-0 transition'
          : 'cat-btn px-3.5 py-1.5 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 shrink-0 transition';
      });
      renderItems();
    }

    function setFilterStatus(status) {
      document.getElementById('filter-status').value = status;
      renderItems();
    }

    function changeQty(id, delta) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const next = Math.max(0, Number(item.qty) + delta);
      if (next === Number(item.qty)) return;
      item.qty = next;
      addLog(delta > 0 ? '補貨入庫' : '日常消耗', item.name, `${delta > 0 ? '+' : ''}${delta} ${item.unit}`);
      persist();
    }

    function recordEmpty(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (Number(item.qty) > 0) item.qty = Number(item.qty) - 1;
      emptiesCount++;
      addLog('空瓶達成', item.name, `-1 ${item.unit}（累計 ${emptiesCount} 空瓶）`);
      persist();
    }

    function markOpened(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.opened = true;
      item.openedDate = new Date().toISOString().split('T')[0];
      addLog('開封啟用', item.name, `開始計算 ${item.pao || 12}M PAO`);
      persist();
    }

    function deleteItem(id) {
      const item = items.find(i => i.id === id);
      if (!item || !confirm(`確定要刪除「${item.name}」嗎？`)) return;
      items = items.filter(i => i.id !== id);
      addLog('刪除品項', item.name, '移除紀錄');
      persist();
    }

    function toggleOpenedDateInput() {
      const checked = document.getElementById('item-opened').checked;
      document.getElementById('opened-date-wrap').classList.toggle('hidden', !checked);
      if (checked && !document.getElementById('item-opened-date').value) {
        document.getElementById('item-opened-date').value = new Date().toISOString().split('T')[0];
      }
    }

    function openItemModal(id = null) {
      document.getElementById('item-form').reset();
      document.getElementById('item-id').value = '';
      document.getElementById('item-min-qty').value = '';
      document.getElementById('opened-date-wrap').classList.add('hidden');
      const statusBox = document.getElementById('barcode-status-box');
      statusBox.classList.add('hidden');
      statusBox.innerHTML = '';
      lastOcrLines = [];
      document.getElementById('modal-title').textContent = id ? '編輯庫存品項' : '新增庫存品項';

      if (id) {
        const item = items.find(i => i.id === id);
        if (item) {
          document.getElementById('item-id').value = item.id;
          document.getElementById('item-category').value = item.category;
          document.getElementById('item-barcode').value = item.barcode || '';
          document.getElementById('item-brand').value = item.brand || '';
          document.getElementById('item-name').value = item.name;
          document.getElementById('item-qty').value = item.qty;
          document.getElementById('item-min-qty').value = (item.minQty !== '' && item.minQty !== null && item.minQty !== undefined) ? item.minQty : '';
          document.getElementById('item-unit').value = item.unit;
          document.getElementById('item-expiry').value = item.expiry || '';
          document.getElementById('item-pao').value = item.pao || 0;
          document.getElementById('item-opened').checked = !!item.opened;
          document.getElementById('item-opened-date').value = item.openedDate || '';
          document.getElementById('item-location').value = item.location || '浴室鏡櫃';
          document.getElementById('item-owner').value = item.owner || '自己';
          toggleOpenedDateInput();
        }
      }
      document.getElementById('item-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeItemModal() {
      stopCameraScanner();
      document.getElementById('item-modal').classList.add('hidden');
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('item-id').value;
      const rawMinQty = document.getElementById('item-min-qty').value.trim();
      const payload = {
        id: id || 'item-' + Date.now(),
        category: document.getElementById('item-category').value,
        barcode: document.getElementById('item-barcode').value.trim(),
        brand: document.getElementById('item-brand').value.trim(),
        name: document.getElementById('item-name').value.trim(),
        qty: Number(document.getElementById('item-qty').value),
        minQty: rawMinQty === '' ? '' : Number(rawMinQty),
        unit: document.getElementById('item-unit').value.trim() || '件',
        expiry: document.getElementById('item-expiry').value,
        pao: Number(document.getElementById('item-pao').value),
        opened: document.getElementById('item-opened').checked,
        openedDate: document.getElementById('item-opened').checked ? document.getElementById('item-opened-date').value : '',
        location: document.getElementById('item-location').value,
        owner: document.getElementById('item-owner').value
      };

      if (payload.brand && payload.brand.length >= 2 && !customBrands.some(b => b.toLowerCase() === payload.brand.toLowerCase())) {
        customBrands.unshift(payload.brand);
        if (customBrands.length > 200) customBrands.pop();
      }

      if (payload.barcode) {
        customBarcodeDict[payload.barcode] = {
          category: payload.category,
          brand: payload.brand,
          name: payload.name,
          pao: payload.pao,
          unit: payload.unit,
          location: payload.location
        };
      }

      if (id) {
        const idx = items.findIndex(i => i.id === id);
        if (idx > -1) items[idx] = payload;
        addLog('編輯品項', payload.name, `庫存 ${payload.qty} ${payload.unit}`);
      } else {
        items.unshift(payload);
        addLog('新增建檔', payload.name, `+${payload.qty} ${payload.unit}`);
      }
      closeItemModal();
      persist();
    }

    function toggleCameraScanner() {
      const readerEl = document.getElementById('qr-reader');
      if (!readerEl.classList.contains('hidden')) {
        stopCameraScanner();
        return;
      }
      readerEl.classList.remove('hidden');
      document.getElementById('cam-btn-text').textContent = '關閉鏡頭';
      html5QrCode = new Html5Qrcode('qr-reader');
      html5QrCode.start(
        { facingMode: 'environment' },
        {
          fps: 15,
          qrbox: { width: 260, height: 110 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        },
        (decodedText) => {
          stopCameraScanner();
          lookupBarcodeInfo(decodedText);
        }
      ).catch(() => {
        alert('無法啟動相機，請確認瀏覽器已允許相機權限。');
        stopCameraScanner();
      });
    }

    function stopCameraScanner() {
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
        html5QrCode = null;
      }
      document.getElementById('qr-reader').classList.add('hidden');
      document.getElementById('cam-btn-text').textContent = '掃條碼';
    }

    function openShoppingModal() {
      const list = items.filter(i => isItemLowStock(i) || (getEffectiveExpiry(i)?.diffDays ?? 999) < 0);
      const body = document.getElementById('shopping-list-body');
      if (!list.length) {
        body.innerHTML = `<p class="text-center text-slate-400 text-sm py-8">目前所有商品庫存充足且未過期！</p>`;
      } else {
        body.innerHTML = list.map(i => `
          <label class="flex items-center justify-between p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
            <div class="flex items-center gap-2.5">
              <input type="checkbox" value="${i.id}" checked class="shop-chk rounded text-rose-600" />
              <div>
                <div class="text-sm font-semibold text-slate-900">${i.brand ? i.brand + ' ' : ''}${i.name}</div>
                <div class="text-xs text-slate-400">現有 ${i.qty} ${i.unit}${isItemLowStock(i) ? `（安全庫存 ${i.minQty}）` : '（已過期需汰換）'}</div>
              </div>
            </div>
            <span class="text-xs font-medium text-rose-600">需補貨</span>
          </label>
        `).join('');
      }
      document.getElementById('shopping-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeShoppingModal() { document.getElementById('shopping-modal').classList.add('hidden'); }

    function copyShoppingList() {
      const checkedIds = Array.from(document.querySelectorAll('.shop-chk:checked')).map(el => el.value);
      const lines = items.filter(i => checkedIds.includes(i.id)).map(i => `• ${i.brand ? i.brand + ' ' : ''}${i.name} (現有 ${i.qty}${i.unit})`);
      if (!lines.length) return alert('請先勾選要複製的項目');
      navigator.clipboard?.writeText(`🛒 美妝日用品採購清單：\n${lines.join('\n')}`);
      alert('採購清單已複製到剪貼簿！');
    }

    function restockCheckedItems() {
      const checkedIds = Array.from(document.querySelectorAll('.shop-chk:checked')).map(el => el.value);
      if (!checkedIds.length) return;
      checkedIds.forEach(id => changeQty(id, 1));
      closeShoppingModal();
    }

    function openLogsModal() {
      const body = document.getElementById('logs-list-body');
      body.innerHTML = logs.length
        ? logs.map(l => `<div class="p-2.5 rounded-xl bg-slate-50 flex items-center justify-between"><div><span class="font-semibold text-slate-800">${l.action}</span>・${l.itemName}<div class="text-[11px] text-slate-400">${l.time}</div></div><span class="text-xs font-medium text-slate-600">${l.deltaText}</span></div>`).join('')
        : `<p class="text-center text-slate-400 py-8">尚無異動紀錄</p>`;
      document.getElementById('logs-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeLogsModal() { document.getElementById('logs-modal').classList.add('hidden'); }
    function openBackupModal() { document.getElementById('backup-modal').classList.remove('hidden'); lucide.createIcons(); }
    function closeBackupModal() { document.getElementById('backup-modal').classList.add('hidden'); }

    function exportData() {
      const blob = new Blob([JSON.stringify({ items, logs, emptiesCount, customBarcodeDict, customBrands }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `beauty-stock-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (Array.isArray(data.items)) {
            items = data.items;
            logs = data.logs || [];
            emptiesCount = data.emptiesCount || 0;
            customBarcodeDict = data.customBarcodeDict || {};
            customBrands = data.customBrands || [];
            persist();
            closeBackupModal();
            alert('備份還原成功！');
          }
        } catch {
          alert('備份檔案格式錯誤');
        }
      };
      reader.readAsText(file);
    }

    (function bootstrapCloudSync() {
      const savedRoom = localStorage.getItem(FIREBASE_ROOM_KEY);
      const savedCfg = localStorage.getItem(FIREBASE_CFG_KEY);
      if (savedRoom && savedCfg) {
        try {
          initFirebaseSync(JSON.parse(savedCfg), savedRoom, false);
        } catch {}
      }
    })();

    renderAll();
    lucide.createIcons();
  </script>
</body>
</html>
